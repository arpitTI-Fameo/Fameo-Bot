[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ai"
version = "0.1.0"
description = "Production-grade AI Support Bot Backend with RAG"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "pgvector>=0.3.5,<1.0",

    # Background processing
    "celery[redis]>=5.4.0,<6.0",

    # Redis
    "redis[hiredis]>=5.1.0,<6.0",

    # LLM integration
    "google-genai>=0.2.0,<1.0",

    # HTTP client
    "httpx>=0.27.0,<1.0",

    # PDF processing
    "pymupdf>=1.24.0,<2.0",

    # Embeddings (local sentence-transformers for dev)
    "sentence-transformers>=3.2.0,<4.0",

    # Tokenization
    "tiktoken>=0.8.0,<1.0",

    # Observability
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-exporter-prometheus>=0.49b0",
    "prometheus-client>=0.21.0,<1.0",
    "structlog>=24.4.0,<25.0",

    # Supabase storage
    "supabase>=2.9.0,<3.0",
    "upstash-redis>=1.2.0",

    # Utilities
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-httpx>=0.34.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.12.0,<2.0",
    "factory-boy>=3.3.0,<4.0",
    "faker>=30.0.0,<31.0",
    "anyio>=4.6.0,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires DB/Redis)",
    "api: API endpoint tests",
    "security: Security-focused tests",
    "evaluation: RAG evaluation tests",
    "slow: Slow-running tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.mypy.overrides]
module = ["celery.*", "pymupdf.*", "sentence_transformers.*", "supabase.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]

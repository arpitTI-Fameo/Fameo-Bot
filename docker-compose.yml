# =============================================================================
# Docker Compose — Development Environment
# Supabase remains an external managed dependency.
# =============================================================================

services:
  # --- API Server ---
  support-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - APP_WORKERS=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # --- Celery Worker ---
  support-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-worker
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
    env_file:
      - .env
    environment:
      - APP_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: support-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis-data:
